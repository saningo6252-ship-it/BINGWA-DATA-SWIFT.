name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android --org com.bingwadataswift --project-name bingwa_data_swift
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Apply app icon and app name
        run: |
          ICON_SRC=""
          if [ -f "assets/app_icon.png" ]; then
            ICON_SRC="assets/app_icon.png"
          elif [ -f "app_icon.png" ]; then
            ICON_SRC="app_icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            IS_PNG=$(python3 -c '
import sys
try:
    with open(sys.argv[1], "rb") as f:
        print("yes" if f.read(8) == b"\x89PNG\r\n\x1a\n" else "no")
except Exception:
    print("no")
' "$ICON_SRC")

            if [ "$IS_PNG" = "yes" ]; then
              rm -rf android/app/src/main/res/mipmap-anydpi-v26
              for dir in android/app/src/main/res/mipmap-*; do
                if [ -d "$dir" ]; then
                  cp "$ICON_SRC" "$dir/ic_launcher.png"
                  cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                  cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
                fi
              done
            else
              echo "Warning: $ICON_SRC is not a raw PNG file; keeping default launcher icons so resource compilation succeeds."
            fi
          fi

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="BINGWA DATA SWIFT"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
