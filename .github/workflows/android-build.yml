name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android --org com.bingwadataswift --project-name bingwa_data_swift
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Check icon format
        run: |
          if [ -f "app_icon.png" ]; then
            file app_icon.png || true
          fi

      - name: Set app label
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          import re
          txt = re.sub(r'\''android:label="[^"]*"'\'', '\''android:label="BINGWA DATA SWIFT"'\'', txt)
          p.write_text(txt, encoding="utf-8")
          '
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
