name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android --org com.bingwadataswift --project-name bingwa_data_swift
          fi

      - name: Disable release lint abort for image_picker_android
        run: |
          python3 -c '
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              txt = groovy.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
          lint {
              checkReleaseBuilds false
              abortOnError false
          }
          """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  groovy.write_text(txt, encoding="utf-8")

          if kotlin.exists():
              txt = kotlin.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  kotlin.write_text(txt, encoding="utf-8")
          '

      - name: Apply app_icon.png to Android launcher mipmaps
        run: |
          if [ -f "app_icon.png" ]; then
            python3 -c '
          from pathlib import Path
          import shutil

          src = Path("app_icon.png")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          try:
              from PIL import Image
              img = Image.open(src).convert("RGBA")
              for folder, px in sizes.items():
                  out_dir = Path("android/app/src/main/res") / folder
                  out_dir.mkdir(parents=True, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  resized.save(out_dir / "ic_launcher.png")
          except Exception:
              for folder in sizes:
                  out_dir = Path("android/app/src/main/res") / folder
                  out_dir.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, out_dir / "ic_launcher.png")
          '
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Set app label
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            python3 -c '
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'\''android:label="[^"]*"'\'', '\''android:label="BINGWA DATA SWIFT"'\'', txt)
          p.write_text(txt, encoding="utf-8")
          '
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
