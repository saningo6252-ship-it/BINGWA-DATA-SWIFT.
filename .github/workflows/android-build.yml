name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android --org com.bingwadataswift --project-name bingwa_data_swift
          fi

      - name: Disable release lint abort for image_picker_android
        run: |
          python3 -c '
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              txt = groovy.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
          lint {
              checkReleaseBuilds false
              abortOnError false
          }
          """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  groovy.write_text(txt, encoding="utf-8")

          if kotlin.exists():
              txt = kotlin.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  kotlin.write_text(txt, encoding="utf-8")
          '

      - name: Apply app_icon.png as valid PNGs to Android launcher mipmaps
        run: |
          if [ -f "app_icon.png" ]; then
            python3 -c '
          from pathlib import Path
          import subprocess

          src = Path("app_icon.png")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          converted_any = False
          try:
              from PIL import Image
              with Image.open(src) as im:
                  rgba = im.convert("RGBA")
                  for folder, px in sizes.items():
                      out_dir = Path("android/app/src/main/res") / folder
                      out_dir.mkdir(parents=True, exist_ok=True)
                      resized = rgba.resize((px, px), Image.Resampling.LANCZOS)
                      resized.save(out_dir / "ic_launcher.png", format="PNG")
                  converted_any = True
          except Exception:
              converted_any = False

          if not converted_any:
              for folder, px in sizes.items():
                  out_dir = Path("android/app/src/main/res") / folder
                  out_dir.mkdir(parents=True, exist_ok=True)
                  out_file = out_dir / "ic_launcher.png"
                  res = subprocess.run(
                      ["ffmpeg", "-y", "-i", str(src), "-vf", f"scale={px}:{px}", str(out_file)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if res.returncode != 0:
                      print(f"Skipping {folder}: could not convert {src} to valid PNG")
          '
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Set app label
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            python3 -c '
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'\''android:label="[^"]*"'\'', '\''android:label="BINGWA DATA SWIFT"'\'', txt)
          p.write_text(txt, encoding="utf-8")
          '
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
