name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android --org com.bingwadataswift --project-name bingwa_data_swift
          fi

      - name: Disable release lint abort for image_picker_android
        run: |
          python3 -c '
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              txt = groovy.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
          lint {
              checkReleaseBuilds false
              abortOnError false
          }
          """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  groovy.write_text(txt, encoding="utf-8")

          if kotlin.exists():
              txt = kotlin.read_text(encoding="utf-8")
              if "checkReleaseBuilds" not in txt:
                  lint_block = """
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              """
                  if "android {" in txt:
                      txt = txt.replace("android {", "android {" + lint_block, 1)
                  else:
                      txt += "\nandroid {" + lint_block + "}\n"
                  kotlin.write_text(txt, encoding="utf-8")
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Check icon format
        run: |
          if [ -f "app_icon.png" ]; then
            file app_icon.png || true
          fi

      - name: Set app label
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          import re
          txt = re.sub(r'\''android:label="[^"]*"'\'', '\''android:label="BINGWA DATA SWIFT"'\'', txt)
          p.write_text(txt, encoding="utf-8")
          '
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
